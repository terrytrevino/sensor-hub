[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-hub"
version = "0.1.0"
description = "Python sensor drivers and utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Terry Trevino" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
